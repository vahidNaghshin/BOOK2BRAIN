[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    ocr: needs a real Tesseract installation (skipped automatically when it is missing)
    sample_book: runs the real PDF pipeline on the sample book in storage/original (skipped when it is missing)
filterwarnings =
    ignore::DeprecationWarning:fitz
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
